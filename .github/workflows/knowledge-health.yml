name: Knowledge health and privacy
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python scripts/check_kb.py
      - name: Run focused audit regression tests
        run: python -B -m unittest scripts.test_check_kb scripts.test_external_links scripts.test_check_public_secrets -v
      - name: Scan public text for credentials
        run: python -B scripts/check_public_secrets.py
      - name: Scan public repository with Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          version=8.30.1
          asset="gitleaks_${version}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          curl --fail --silent --show-error --location "$base/$asset" --output "$RUNNER_TEMP/$asset"
          curl --fail --silent --show-error --location "$base/gitleaks_${version}_checksums.txt" --output "$RUNNER_TEMP/gitleaks-checksums.txt"
          grep " $asset$" "$RUNNER_TEMP/gitleaks-checksums.txt" | (cd "$RUNNER_TEMP" && sha256sum --check)
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --redact=100 --exit-code=1
