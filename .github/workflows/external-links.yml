name: Periodic external link check
on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 1 * *'
permissions:
  contents: read
jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -B scripts/check_external_links.py --audit-csv "$RUNNER_TEMP/external-links.csv"
